
{% block content %}
<h2>당첨자 목록 – 회차 #{{ draw.id }}</h2>

<table border="1" cellpadding="6" style="min-width:640px;">
    <thead>
        <tr>
            <th>#</th>
            <th>사용자</th>
            <th>적중수</th>
            <th>등수</th>
            <th>상금</th>
            <th>번호</th>
        </tr>
    </thead>
    <tbody>
        {% for o in orders %}
        <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ o.user }}</td>
            <td>{{ o.matched }}</td>
            <td>{{ o.rank }}</td>
            <td>{{ o.prize }}</td>
            <td>{{ o.numbers }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="6">당첨자가 없습니다.</td></tr>
        {% endfor %}
    </tbody>
</table>

<p style="margin-top:12px;">
    <a href="{% url 'lotto:index' %}">← 홈으로</a>
</p>
{% endblock %}
